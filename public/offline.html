<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#064e3b">
    <title>You're offline · Harimohan'12</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #f6f7f6; color: #1e293b; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Hind Siliguri", sans-serif; }
        .card { width: 100%; max-width: 440px; background: #fff; border-radius: 24px; padding: 32px 24px; text-align: center; box-shadow: 0 1px 2px rgb(15 23 42 / .06), 0 12px 32px -12px rgb(15 23 42 / .15); border: 1px solid #e2e8f0; }
        .icon { font-size: 44px; line-height: 1; }
        h1 { margin: 16px 0 0; font-size: 22px; line-height: 1.3; color: #0f172a; }
        p { margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: #475569; }
        .btn { display: inline-block; margin-top: 24px; border-radius: 999px; padding: 11px 20px; font-size: 14px; font-weight: 600; text-decoration: none; background: #0f172a; color: #fff; }
        .btn:hover { background: #065f46; }
        .brand { margin-top: 24px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
<main class="card">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>You're offline</h1>
    <p>We couldn't reach Harimohan'12 because your phone or computer isn't connected to the internet. Check your Wi-Fi or mobile data, then try again.</p>
    <a class="btn" href="">Try again</a>
    <div class="brand">Harimohan'12</div>
</main>
</body>
</html>
